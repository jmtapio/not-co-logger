[project]
name = "notcologger"
version = "0.3.0"
description = "Not CO Logger, a cloud logging library."
authors = [{name = "Juha-Matti Tapio", email = "jmtapio@verkkotelakka.net"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]


[project.urls]
Repository = "https://github.com/jmtapio/not-co-logger"

[dependency-groups]
dev = ["build>=1.2,<2", "twine>=6,<7", "flake8>=7,<8"]

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"
